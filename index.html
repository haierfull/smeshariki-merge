<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e85d75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Смешарики: Слияние</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @font-face {
    font-family: "GameFont";
    src: url("assets/font.ttf") format("truetype");
    font-display: swap;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #fff3d1;
    font-family: "GameFont", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #fff3d1; color: #5a3825; font-size: 20px; font-weight: bold; z-index: 10;
  }
</style>
</head>
<body>
<div id="loading">Загрузка…</div>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
